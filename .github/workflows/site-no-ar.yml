name: Site no ar

# O cron pede 5 minutos, mas o GitHub atrasa execucoes agendadas em repositorio publico
# (hoje sai a cada 6 a 8 horas). Nao ligamos um laco longo neste fluxo: ver docs/custo-e-limites.md
# e a regra de zero custo adicional, enquanto o minReplicas do Azure nao for confirmado.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  conferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Conferir /health e atualizar o alarme
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: producao
          URL_PRINCIPAL: https://toctocaluguel.com.br/health
          URL_ANTIGO: https://zedoaluguel.com.br/health
        run: bash scripts/conferir-site.sh
